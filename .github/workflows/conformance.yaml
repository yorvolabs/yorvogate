---
name: Conformance

# The conformance suite against a real Docker (this runner's: a throwaway machine, where an attack
# that got through would do no harm), real Compose, on both image stores and a hardened daemon. Called
# by CI with the pinned Engine (every pull request the same), and by Docker's newest
# (docker-latest.yaml) with the newest patch of each certified major.
on:
  workflow_call:
    inputs:
      docker_version:
        description: The Docker Engine to install (29.9.2)
        required: true
        type: string
      docker_api:
        description: Its API version, checked when given (1.56)
        required: false
        type: string
        default: ''
      bench:
        description: Run the benchmark too (test/bench), on one leg; only CI's call does, on the pinned Engine its baseline is of
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance (a real Docker, real Compose; ${{ matrix.store }} image store, ${{ matrix.daemon }} daemon)
    runs-on: ubuntu-26.04
    # The benchmark's quick run takes about half an hour more; its full run (at night or by hand)
    # about 2 hours more on an 8-CPU machine, without removing its images (-leave)
    timeout-minutes: ${{ !inputs.bench && 45 || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 300 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        # Docker's two image stores name what image.load loads by different files of the archive
        store: [containerd, classic]
        daemon: [default]
        # And a CIS-hardened daemon, as on the hosts YorvoGate is for: every container under
        # no-new-privileges (which rootless BuildKit must opt out of), no inter-container traffic on
        # the default bridge, no userland proxy, live restore. userns-remap is left out: it changes
        # who owns volumes' files, and isn't what the gate's hosts run.
        include:
          - store: containerd
            daemon: hardened
    env:
      DOCKER_VERSION: ${{ inputs.docker_version }}
      DOCKER_API: ${{ inputs.docker_api }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      # The runner's own Docker could be any version: Docker's packages for this Ubuntu, pinned, from
      # Docker's repository (its signing key checked by fingerprint).
      - name: Docker Engine ${{ inputs.docker_version }}
        env:
          STORE: ${{ matrix.store }}
          DAEMON: ${{ matrix.daemon }}
        run: |
          test/ci/docker-repo.sh setup
          test/ci/docker-repo.sh install "$DOCKER_VERSION"
          # The image store, set either way (the default depends on how Docker was installed)
          sudo python3 -c 'import json, os, sys; p = "/etc/docker/daemon.json"; c = json.load(open(p)) if os.path.exists(p) else {}; c.setdefault("features", {})["containerd-snapshotter"] = sys.argv[1] == "containerd"; json.dump(c, open(p, "w"))' "$STORE"
          if [ "$DAEMON" = hardened ]; then
            sudo python3 -c 'import json; p = "/etc/docker/daemon.json"; c = json.load(open(p)); c.update({"no-new-privileges": True, "icc": False, "userland-proxy": False, "live-restore": True, "log-level": "info"}); json.dump(c, open(p, "w"))'
          fi
          # An upgrade starts Docker in its own scripts, and its unit allows 3 starts a minute
          sudo systemctl reset-failed docker.service docker.socket || true
          sudo systemctl restart docker || { sudo journalctl -u docker.service --no-pager -n 50; exit 1; }
          driver=$(docker info --format '{{json .DriverStatus}}')
          case "$STORE" in
            containerd) echo "$driver" | grep -q io.containerd.snapshotter ;;
            classic) ! echo "$driver" | grep -q io.containerd.snapshotter ;;
          esac
          # The Engine asked for, and (when the caller pins it) its API version
          [ "$(docker version --format '{{.Server.Version}}')" = "$DOCKER_VERSION" ]
          if [ -n "$DOCKER_API" ]; then
            [ "$(docker version --format '{{.Server.APIVersion}}')" = "$DOCKER_API" ]
          fi
      - name: Build
        run: docker compose -f compose.dev.yaml run --rm go make build
      # A leg that fell back to Docker's defaults would pass without testing what it's for
      - name: The daemon is hardened, as Docker and YorvoGate read it
        if: matrix.daemon == 'hardened'
        run: |
          set -o pipefail
          docker info --format '{{json .SecurityOptions}}' | grep -q 'name=no-new-privileges'
          printf 'version: 1\nupstream: unix:///var/run/docker.sock\nlisteners:\n  - name: admin\n    address: tcp://127.0.0.1:2399\n    mode: trusted\n    allow: {system: read}\n' > "$RUNNER_TEMP/hardened.yaml"
          bin/yorvogate check --docker --config "$RUNNER_TEMP/hardened.yaml" | tee "$RUNNER_TEMP/check.txt"
          grep -q 'Docker runs every container with no-new-privileges' "$RUNNER_TEMP/check.txt"
      # Ubuntu restricts unprivileged user namespaces with AppArmor: rootless BuildKit starts only
      # under the profile YorvoGate ships for it (docs/configuration.md, Builders).
      - name: The AppArmor profile for rootless BuildKit
        run: |
          sudo cp examples/apparmor/yorvogate-buildkit-rootless /etc/apparmor.d/
          sudo apparmor_parser -r /etc/apparmor.d/yorvogate-buildkit-rootless
          sudo aa-status | grep -q yorvogate-buildkit-rootless
      - name: The suite, then Quire Server's use
        env:
          YGC_APPARMOR: yorvogate-buildkit-rootless
        run: test/conformance/run.sh
      - name: The gate's logs are the log schema's, and carry the codes the attacks call for
        run: docker compose -f compose.dev.yaml run --rm -T -e YGC_LOGS=/src/test/conformance/out go go test -count=1 -run TestConformanceLogs ./cmd/yorvogate/
      # The roadmap's load test (0.4-d): one scope's 1,000 slow uploads, or 1,000 connections that send
      # nothing, don't move another's p99; on one leg (what it measures isn't the store's or the
      # daemon's), against the gate the suite ran
      - name: Set up Go (the load test's and the benchmark's)
        if: matrix.store == 'containerd' && matrix.daemon == 'default'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/load/go.mod
          cache: false
      - name: One scope can't starve another
        if: matrix.store == 'containerd' && matrix.daemon == 'default'
        working-directory: test/load
        env:
          CGO_ENABLED: '0'
          YGL_GATE: ${{ github.workspace }}/bin/yorvogate
          YGL_DOCKER: /var/run/docker.sock
        run: go test -count=1 -v -timeout 30m ./
      # The benchmark (test/bench, docs/performance.md), on the same leg after the load test. On a pull
      # request, the quick run, failing on a figure past its threshold twice (baseline.json, and the
      # absolute bounds on scaling); at night, the full run, reported only. Its results are the run's
      # bench artifact, what a new baseline is made from.
      - name: The benchmark
        id: bench
        if: inputs.bench && matrix.store == 'containerd' && matrix.daemon == 'default'
        working-directory: test/bench
        env:
          CGO_ENABLED: '0'
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          GATE: ${{ github.workspace }}/bin/yorvogate
          OUT: ${{ runner.temp }}/bench
        run: |
          if [ "$FULL" = true ]; then
            go run . -gate "$GATE" -docker /var/run/docker.sock -out "$OUT" -full -leave -baseline baseline.json
          else
            go run . -gate "$GATE" -docker /var/run/docker.sock -out "$OUT" -baseline baseline.json -fail
          fi
          cat "$OUT/results.md" >> "$GITHUB_STEP_SUMMARY"
      - name: The benchmark's results
        if: always() && steps.bench.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: ${{ runner.temp }}/bench
          if-no-files-found: ignore
