---
name: CI

# The checks that decide whether a pull request can be merged: the same as "make check" in the
# development container, so a green run here is a green run there. Every night too: new advisories
# for Go and the dependencies (govulncheck) come without a change.
on:
  push:
    branches:
      - main
  pull_request: ~
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, staticcheck, tests, govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: make check
        run: docker compose -f compose.dev.yaml run --rm go make check
      - name: The module is tidy
        run: |
          docker compose -f compose.dev.yaml run --rm go go mod tidy
          git diff --exit-code go.mod go.sum
