---
name: CI

# The checks that decide whether a pull request can be merged: "make check" as in the development
# container, a short fuzzing run, and the conformance suite against a real Docker (this runner's: a
# throwaway machine, where an attack that got through would do no harm). Every night too, with longer
# fuzzing and mutation testing: new advisories (govulncheck) and new findings come without a change.
on:
  push:
    branches:
      - main
  pull_request: ~
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, staticcheck, tests, govulncheck
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: make check
        run: docker compose -f compose.dev.yaml run --rm go make check
      - name: The module is tidy
        run: |
          docker compose -f compose.dev.yaml run --rm go go mod tidy
          git diff --exit-code go.mod go.sum
      # The differential suite's own module, its moby pin included (test/differential/README.md)
      - name: The differential suite's module is tidy
        run: |
          docker compose -f compose.dev.yaml run --rm -w /src/test/differential -e CGO_ENABLED=0 go go mod tidy
          git diff --exit-code test/differential/go.mod test/differential/go.sum

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Each fuzz target (30 seconds on a pull request, 10 minutes at night)
        run: docker compose -f compose.dev.yaml run --rm go make fuzz FUZZTIME=${{ github.event_name == 'schedule' && '10m' || '30s' }}

  conformance:
    # The Docker Engine the suite runs against; its CLI, Compose (5.7.1) and buildx (0.39.0) come with
    # the pinned docker:29.10.0-cli image run.sh uses.
    uses: ./.github/workflows/conformance.yaml
    permissions:
      contents: read
    with:
      docker_version: 29.10.0
      docker_api: '1.57'
      # The benchmark's baseline is of this Engine, on this runner: only this call runs it
      bench: true

  quire-config:
    name: Quire Server's configuration is the pinned one
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # quire.sh runs Quire Server's configuration as test/conformance/quire pins it; the copy must be
      # the file at the commit it names, or the conformance tests a policy Quire doesn't run.
      - name: The copy is the file at its commit
        run: |
          . test/conformance/quire/SOURCE
          curl -fsSL "https://raw.githubusercontent.com/${repository#https://github.com/}/$commit/$path" -o /tmp/quire.yaml
          diff -u /tmp/quire.yaml test/conformance/quire/yorvogate.yaml
      # Nightly, the copy is also the file Quire Server runs now: a change on its main means the pin
      # (and the policy quire.sh tests) is behind what Quire deploys.
      - name: The copy is the file on Quire Server's main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          . test/conformance/quire/SOURCE
          curl -fsSL "https://raw.githubusercontent.com/${repository#https://github.com/}/main/$path" -o /tmp/quire-main.yaml
          diff -u test/conformance/quire/yorvogate.yaml /tmp/quire-main.yaml || { echo "::error::Quire Server's $path changed on main since $commit: copy it to test/conformance/quire and move the pin"; exit 1; }

  dist:
    name: A release's files
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What the release workflow publishes: the binaries, the schemas and the AppArmor profile, each
      # in SHA256SUMS, the copied files the repo's
      - name: make dist
        run: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f compose.dev.yaml run --rm go make dist VERSION=0.0.0-ci
      - name: The files, and their checksums
        run: test/dist.sh dist 0.0.0-ci

  scripts:
    name: Shell scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: docker run --rm -v "$PWD:/m:ro" koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002 sh -c 'shellcheck -s sh $(find /m -name "*.sh")'

  image:
    name: Image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build it
        run: docker build --pull --build-arg VERSION=ci -t yorvogate:ci .
      - name: It runs, as the user it says, with no shell
        run: |
          [ "$(docker run --rm yorvogate:ci version)" = "yorvogate ci" ]
          [ "$(docker image inspect yorvogate:ci --format '{{.Config.User}}')" = "65532:65532" ]
          ! docker run --rm --entrypoint sh yorvogate:ci -c true 2>/dev/null
      - name: No known flaw with a fix in it
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --quiet --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 yorvogate:ci

  # One job per package, side by side: all five in one job outgrew an hour
  mutation:
    name: Mutation testing (${{ matrix.package }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [internal/route, internal/config, internal/scope, internal/gate, cmd/yorvogate]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Each package's tests kill at least 90% of their mutants
        run: docker compose -f compose.dev.yaml run --rm go make mutation PACKAGES=./${{ matrix.package }}

  differential-nightly:
    name: The differential suite against a real Docker
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # The Engine whose code the suite's recorder is (test/differential/go.mod pins moby at its
      # commit): the two move together
      DOCKER_VERSION: 29.10.0
      DOCKER_API: '1.57'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker Engine ${{ env.DOCKER_VERSION }}
        run: |
          test/ci/docker-repo.sh setup
          test/ci/docker-repo.sh install "$DOCKER_VERSION"
          sudo systemctl reset-failed docker.service docker.socket || true
          sudo systemctl restart docker || { sudo journalctl -u docker.service --no-pager -n 50; exit 1; }
          [ "$(docker version --format '{{.Server.Version}} {{.Server.APIVersion}}')" = "$DOCKER_VERSION $DOCKER_API" ]
      - name: Set up Go (go.mod's)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The same variants, through the same gate, to the real Docker
        working-directory: test/differential
        env:
          CGO_ENABLED: '0'
          YGD_DOCKER: /var/run/docker.sock
        run: go test -count=1 -timeout 40m -run TestAgainstARealDocker -v ./
