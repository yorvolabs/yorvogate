---
name: CI

# The checks that decide whether a pull request can be merged: "make check" as in the development
# container, a short fuzzing run, and the conformance suite against a real Docker (this runner's: a
# throwaway machine, where an attack that got through would do no harm). Every night too, with longer
# fuzzing and mutation testing: new advisories (govulncheck) and new findings come without a change.
on:
  push:
    branches:
      - main
  pull_request: ~
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, staticcheck, tests, govulncheck
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: make check
        run: docker compose -f compose.dev.yaml run --rm go make check
      - name: The module is tidy
        run: |
          docker compose -f compose.dev.yaml run --rm go go mod tidy
          git diff --exit-code go.mod go.sum

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Each fuzz target (30 seconds on a pull request, 10 minutes at night)
        run: docker compose -f compose.dev.yaml run --rm go make fuzz FUZZTIME=${{ github.event_name == 'schedule' && '10m' || '30s' }}

  conformance:
    name: Conformance (a real Docker, real Compose; ${{ matrix.store }} image store, ${{ matrix.daemon }} daemon)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Docker's two image stores name what image.load loads by different files of the archive
        store: [containerd, classic]
        daemon: [default]
        # And a CIS-hardened daemon, as on the hosts YorvoGate is for: every container under
        # no-new-privileges (which rootless BuildKit must opt out of), no inter-container traffic on
        # the default bridge, no userland proxy, live restore. userns-remap is left out: it changes
        # who owns volumes' files, and isn't what the gate's hosts run.
        include:
          - store: containerd
            daemon: hardened
    env:
      # The Docker Engine the suite runs against; its CLI, Compose (5.6.1) and buildx (0.38.1) come
      # with the pinned docker:29.9.2-cli image run.sh uses.
      DOCKER_VERSION: 29.9.2
      DOCKER_API: '1.56'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      # The runner's own Docker could be any version: Docker's packages for this Ubuntu, pinned, from
      # Docker's repository (its signing key checked by fingerprint).
      - name: Docker Engine ${{ env.DOCKER_VERSION }}
        run: |
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o docker.asc
          gpg --show-keys --with-colons docker.asc | grep -q '^fpr:::::::::9DC858229FC7DD38854AE2D88D81803C0EBFCD88:$'
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo install -m 0644 docker.asc /etc/apt/keyrings/docker.asc
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update -q
          version="5:$DOCKER_VERSION-1~ubuntu.$VERSION_ID~$VERSION_CODENAME"
          sudo apt-get install -y -q --allow-downgrades "docker-ce=$version" "docker-ce-cli=$version" containerd.io
          # The image store, set either way (the default depends on how Docker was installed)
          sudo python3 -c 'import json, os, sys; p = "/etc/docker/daemon.json"; c = json.load(open(p)) if os.path.exists(p) else {}; c.setdefault("features", {})["containerd-snapshotter"] = sys.argv[1] == "containerd"; json.dump(c, open(p, "w"))' "${{ matrix.store }}"
          if [ "${{ matrix.daemon }}" = hardened ]; then
            sudo python3 -c 'import json; p = "/etc/docker/daemon.json"; c = json.load(open(p)); c.update({"no-new-privileges": True, "icc": False, "userland-proxy": False, "live-restore": True, "log-level": "info"}); json.dump(c, open(p, "w"))'
          fi
          # An upgrade starts Docker in its own scripts, and its unit allows 3 starts a minute
          sudo systemctl reset-failed docker.service docker.socket || true
          sudo systemctl restart docker || { sudo journalctl -u docker.service --no-pager -n 50; exit 1; }
          driver=$(docker info --format '{{json .DriverStatus}}')
          case "${{ matrix.store }}" in
            containerd) echo "$driver" | grep -q io.containerd.snapshotter ;;
            classic) ! echo "$driver" | grep -q io.containerd.snapshotter ;;
          esac
          [ "$(docker version --format '{{.Server.Version}} {{.Server.APIVersion}}')" = "$DOCKER_VERSION $DOCKER_API" ]
      - name: Build
        run: docker compose -f compose.dev.yaml run --rm go make build
      # A leg that fell back to Docker's defaults would pass without testing what it's for
      - name: The daemon is hardened, as Docker and YorvoGate read it
        if: matrix.daemon == 'hardened'
        run: |
          set -o pipefail
          docker info --format '{{json .SecurityOptions}}' | grep -q 'name=no-new-privileges'
          printf 'version: 1\nupstream: unix:///var/run/docker.sock\nlisteners:\n  - name: admin\n    address: tcp://127.0.0.1:2399\n    mode: trusted\n    allow: {system: read}\n' > "$RUNNER_TEMP/hardened.yaml"
          bin/yorvogate check --docker --config "$RUNNER_TEMP/hardened.yaml" | tee "$RUNNER_TEMP/check.txt"
          grep -q 'Docker runs every container with no-new-privileges' "$RUNNER_TEMP/check.txt"
      # Ubuntu restricts unprivileged user namespaces with AppArmor: rootless BuildKit starts only
      # under the profile YorvoGate ships for it (docs/configuration.md, Builders).
      - name: The AppArmor profile for rootless BuildKit
        run: |
          sudo cp examples/apparmor/yorvogate-buildkit-rootless /etc/apparmor.d/
          sudo apparmor_parser -r /etc/apparmor.d/yorvogate-buildkit-rootless
          sudo aa-status | grep -q yorvogate-buildkit-rootless
      - name: The suite, then Quire Server's use
        env:
          YGC_APPARMOR: yorvogate-buildkit-rootless
        run: test/conformance/run.sh

  quire-config:
    name: Quire Server's configuration is the pinned one
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # quire.sh runs Quire Server's configuration as test/conformance/quire pins it; the copy must be
      # the file at the commit it names, or the conformance tests a policy Quire doesn't run.
      - name: The copy is the file at its commit
        run: |
          . test/conformance/quire/SOURCE
          curl -fsSL "https://raw.githubusercontent.com/${repository#https://github.com/}/$commit/$path" -o /tmp/quire.yaml
          diff -u /tmp/quire.yaml test/conformance/quire/yorvogate.yaml

  dist:
    name: A release's files
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What the release workflow publishes: the binaries, the schemas and the AppArmor profile, each
      # in SHA256SUMS, the copied files the repo's
      - name: make dist
        run: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f compose.dev.yaml run --rm go make dist VERSION=0.0.0-ci
      - name: The files, and their checksums
        run: test/dist.sh dist 0.0.0-ci

  scripts:
    name: Shell scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: docker run --rm -v "$PWD:/m:ro" koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002 sh -c 'shellcheck -s sh $(find /m -name "*.sh")'

  image:
    name: Image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build it
        run: docker build --pull --build-arg VERSION=ci -t yorvogate:ci .
      - name: It runs, as the user it says, with no shell
        run: |
          [ "$(docker run --rm yorvogate:ci version)" = "yorvogate ci" ]
          [ "$(docker image inspect yorvogate:ci --format '{{.Config.User}}')" = "65532:65532" ]
          ! docker run --rm --entrypoint sh yorvogate:ci -c true 2>/dev/null
      - name: No known flaw with a fix in it
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --quiet --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 yorvogate:ci

  mutation:
    name: Mutation testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Each package's tests kill at least 90% of their mutants
        run: docker compose -f compose.dev.yaml run --rm go make mutation
