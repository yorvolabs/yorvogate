---
name: Release

# A version tag (v1.2.3) on main makes a release, once CI has passed on its commit:
#   - the image, ghcr.io/yorvolabs/yorvogate:<version>, for x86_64 and arm64, with its SBOM and build
#     provenance, scanned (no fixable high or critical flaw), and signed with Sigstore (keyless: the
#     signature says this workflow made it, for this tag), pushed by its digest and tagged only then;
#   - the binaries for Linux (x86_64, arm64), the formats' JSON Schemas, the AppArmor profile for
#     rootless BuildKit, their SHA256SUMS, and its signature (a Sigstore bundle);
#   - a GitHub release with them, and the changelog's section for the version as its notes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository == 'yorvolabs/yorvogate'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write   # the GitHub release
      actions: read     # CI's run on the tagged commit
      packages: write   # the image on ghcr.io
      id-token: write   # Sigstore's keyless signing: this workflow's identity
    env:
      IMAGE: ghcr.io/yorvolabs/yorvogate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The version, from a tag on main
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::$GITHUB_REF_NAME isn't a version."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME isn't on main."; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: CI passed on it
        # A tag alone makes no release: CI's run on the commit, as it was pushed to main, must have
        # passed, every job of it (whatever a matrix names them). The newest such run counts. It may
        # not have started or finished when the tag is pushed: waited for, half an hour at most.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=100" \
              --jq '.workflow_runs | map(select(.head_sha == env.GITHUB_SHA and .event == "push" and .head_branch == "main")) | sort_by(.created_at) | last | if . == null then "missing - -" else "\(.status) \(.conclusion // "-") \(.html_url)" end')
            read -r status conclusion url <<< "$run"
            [ "$status" = completed ] && break
            sleep 30
          done
          [ "$status $conclusion" = "completed success" ] || { echo "::error::CI's run on $GITHUB_SHA: $status, $conclusion ($url). No release without it."; exit 1; }
          echo "CI passed: $url"

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By its digest only: the version names it once it's scanned and signed ("Tag the signed image")
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ steps.version.outputs.version }}
          # How it was built, and what's in it, attached to the image. mode=max records every build
          # arg in the provenance, which anyone can read: VERSION is the only one there may be.
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

      - name: No known flaw with a fix in it
        # Before it's signed: an image that fails here never checks out. Signed in (a new package may
        # still be private), its database from Google's mirror first (ghcr.io limits anonymous
        # downloads), and what it said an annotation.
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! out=$(docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
              --quiet --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE@${{ steps.image.outputs.digest }}" 2>&1); then
            printf '%s\n' "$out"
            echo "::error title=Image scan::$(printf '%s' "$out" | grep -E 'FATAL|CRITICAL|HIGH|error' | head -5 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          printf '%s\n' "$out"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.image.outputs.digest }}"

      - name: Tag the signed image
        # The version names exactly the image scanned and signed: tagged as it is (one source, so the
        # index is copied unchanged), then read back. Another digest under the tag is a failed release.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ "$tagged" = "$DIGEST" ] || { echo "::error::$IMAGE:$VERSION is $tagged, not the signed $DIGEST."; exit 1; }

      - name: The binaries, their checksums, signed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f compose.dev.yaml run --rm go make dist VERSION="$VERSION"
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # The changelog's section for the version, and the image by digest
          awk -v v="$VERSION" '/^## \[/{ if (found) exit; if (index($0, "## [" v "]")) { found=1; next } } found' CHANGELOG.md > notes.md
          printf '\n**Image:** `%s@%s`\n' "$IMAGE" "$DIGEST" >> notes.md
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "v$VERSION" --title "YorvoGate $VERSION" --notes-file notes.md --verify-tag $prerelease dist/*

      # The release as published, downloaded: every file there, in SHA256SUMS, and the copied ones
      # (the schemas, the AppArmor profile) the repo's at this tag
      - name: The release's files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "v$VERSION" --dir published
          test/dist.sh published "$VERSION"
