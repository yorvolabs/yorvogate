---
name: Release

# A version tag (v1.2.3) on main makes a release, once CI has passed on its commit:
#   - the image, ghcr.io/yorvolabs/yorvogate:<version>, for x86_64 and arm64, with its SBOM and build
#     provenance, scanned (no fixable high or critical flaw), and signed with Sigstore (keyless: the
#     signature says this workflow made it, for this tag);
#   - the binaries for Linux (x86_64, arm64), their SHA256SUMS, and its signature (a Sigstore bundle);
#   - a GitHub release with them, and the changelog's section for the version as its notes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository == 'yorvolabs/yorvogate'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write   # the GitHub release
      checks: read      # CI's checks of the tagged commit
      packages: write   # the image on ghcr.io
      id-token: write   # Sigstore's keyless signing: this workflow's identity
    env:
      IMAGE: ghcr.io/yorvolabs/yorvogate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The version, from a tag on main
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::$GITHUB_REF_NAME isn't a version."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME isn't on main."; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: CI passed on it
        # A tag alone makes no release: the commit must have passed CI's checks. They may still be
        # running when the tag is pushed: waited for, half an hour at most.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in 'Format, vet, staticcheck, tests, govulncheck' 'Fuzzing' 'Conformance (a real Docker, real Compose)' 'Shell scripts' 'Image'; do
            for attempt in $(seq 60); do
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq ".check_runs | map(select(.name == \"$check\")) | sort_by(.started_at) | last | if . == null then \"missing\" else (.conclusion // \"running\") end")
              [ "$conclusion" = running ] || [ "$conclusion" = missing ] || break
              sleep 30
            done
            [ "$conclusion" = success ] || { echo "::error::CI's \"$check\" on $GITHUB_SHA: $conclusion. No release without it."; exit 1; }
          done

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          # How it was built, and what's in it, attached to the image
          provenance: mode=max
          sbom: true

      - name: No known flaw with a fix in it
        # Before it's signed: an image that fails here never checks out.
        run: docker run --rm aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE@${{ steps.image.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.image.outputs.digest }}"

      - name: The binaries, their checksums, signed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f compose.dev.yaml run --rm go make dist VERSION="$VERSION"
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # The changelog's section for the version, and the image by digest
          awk -v v="$VERSION" '/^## \[/{ if (found) exit; if (index($0, "## [" v "]")) { found=1; next } } found' CHANGELOG.md > notes.md
          printf '\n**Image:** `%s@%s`\n' "$IMAGE" "$DIGEST" >> notes.md
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "v$VERSION" --title "YorvoGate $VERSION" --notes-file notes.md --verify-tag $prerelease dist/*
