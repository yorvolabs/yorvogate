# Working on YorvoGate: Go and its tools in a container, the module cache in a volume.
#   docker compose -f compose.dev.yaml run --rm go make check
services:
  # A new volume is root's: handed to the user who runs the checks before "go" starts (Compose runs
  # it first, by itself), again whole only when that user changes.
  cache:
    image: golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /cache/build /cache/mod && if [ "$$(stat -c %u:%g /cache)" != "${HOST_UID:-1000}:${HOST_GID:-1000}" ]; then chown -R "${HOST_UID:-1000}:${HOST_GID:-1000}" /cache; fi
    volumes:
      - cache:/cache
    labels:
      org.yorvolabs.project: yorvogate

  go:
    image: golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      cache:
        condition: service_completed_successfully
    working_dir: /src
    environment:
      HOME: /tmp
      GOCACHE: /cache/build
      GOMODCACHE: /cache/mod
      GOTOOLCHAIN: local
    volumes:
      - .:/src
      - cache:/cache
    labels:
      org.yorvolabs.project: yorvogate

volumes:
  cache:
    labels:
      org.yorvolabs.project: yorvogate

networks:
  default:
    labels:
      org.yorvolabs.project: yorvogate
